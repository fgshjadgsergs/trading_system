[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.1.0"
description = "Liquidity map trading system (Binance USDT-M first, multi-exchange schema from day one)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "websockets>=12",
    "structlog>=24",
    "pyyaml>=6",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mplfinance>=0.12.10b0",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.4",
    "pre-commit>=3",
]
accel = ["numba>=0.59"]
crosscheck = ["vectorbt"]
boost = ["lightgbm>=4"]

[tool.setuptools.packages.find]
include = ["trading_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "stress: нагрузочные/адверсариальные тесты (tests/stress/); масштаб — env STRESS_SCALE",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
