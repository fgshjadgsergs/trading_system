<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта ликвидаций · live</title>
<style>
:root{--bg:#0d1117;--grid:#1d2733;--text:#9fb0bd;--up:#26a69a;--down:#ef5350;
--hot:#ffe95c;--dim:#5c6f7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:13px "SF Mono",Consolas,Menlo,monospace;overflow:hidden}
header{display:flex;gap:.8rem;align-items:center;padding:.55rem 1rem;
border-bottom:1px solid var(--grid);flex-wrap:wrap}
header h1{font-size:14px;margin:0;color:#c5d0d9;font-weight:600}
select,button{background:var(--bg);color:#c5d0d9;border:1px solid var(--grid);
padding:.25rem .55rem;border-radius:3px;font:inherit;cursor:pointer}
button:hover{border-color:var(--dim)}
button.active{border-color:var(--up);color:var(--up)}
#status{margin-left:auto;font-size:11px;color:var(--dim)}
#status b{color:var(--up);font-weight:600}
#wrap{position:relative;height:calc(100vh - 46px);min-height:300px;
cursor:grab;touch-action:none}
#wrap.drag{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%}
#overlay{pointer-events:none}
#hint{position:absolute;left:10px;bottom:28px;font-size:10px;color:var(--dim);
pointer-events:none;background:rgba(13,17,23,.85);padding:2px 7px;border-radius:3px}
</style>
</head>
<body>
<header>
  <h1>Карта ликвидаций · live</h1>
  <select id="symbol"></select>
  <select id="tf" title="таймфрейм показа — карта одна, меняется только нарезка">
    <option value="1">1m</option><option value="5">5m</option>
    <option value="15">15m</option><option value="30">30m</option>
    <option value="60">1h</option>
  </select>
  <button id="zin" title="крупнее по времени">＋</button>
  <button id="zout" title="мельче по времени">－</button>
  <button id="follow" class="active" title="прилипнуть к последнему бару и авто-диапазону">авто</button>
  <span id="status">подключение…</span>
</header>
<div id="wrap">
  <canvas id="heat"></canvas>
  <canvas id="overlay"></canvas>
  <span id="hint">колесо — зум по цене · Shift+колесо — по времени · перетаскивание — сдвиг · двойной клик — авто</span>
</div>
<script>
"use strict";
/* Дорисовка, не перерисовка: пока вид (окно цены, ширина колонки, привязка
   к правому краю) не менялся, новые кадры дорисовываются справа —
   window.__appends. Любая смена вида (зум/пан/resize/расширение автоокна)
   честно перерисовывает тепловой слой из локальных данных — __fullRepaints.
   Свечи и подписи — отдельный слой поверх, он лёгкий. */
window.__fullRepaints = 0; window.__appends = 0; window.__gapReloads = 0;

const $ = id => document.getElementById(id);
const heatCv = $("heat"), ovCv = $("overlay"), wrap = $("wrap");
const hx = heatCv.getContext("2d"), ox = ovCv.getContext("2d");

const S = {
  symbol: null, epoch: null, lastTs: 0,
  frames: [], bars: [],        // сырые минутные данные (хвост кольца сервера)
  bucket: 1, vmaxLog: 1,
  keep: 6000,                  // сколько кадров держим локально
  tf: 1,                       // таймфрейм ПОКАЗА в минутах: карта одна,
};                             // меняется только нарезка свечей и кадров
const D = { frames: [], bars: [] };   // вид: агрегированные свечи + кадры
const MIN_NS = 60_000_000_000;

function buildDisplay() {
  /* Тот же принцип, что и в статичном рендере: старший ТФ не пересчитывает
     карту — свечи схлопываются группами по ts_open, кадр группы = последний
     сырой кадр в ней (состояние карты на закрытии бара показа). Последняя
     группа может быть НЕполной — это формирующаяся свеча. */
  const F = S.tf;
  if (F === 1) { D.frames = S.frames; D.bars = S.bars; return; }
  const span = F * MIN_NS;
  D.frames = []; D.bars = [];
  let g = null, cur = null;
  for (let i = 0; i < S.bars.length; i++) {
    const b = S.bars[i], gi = Math.floor(b.ts_open / span);
    if (gi !== g) {
      g = gi;
      cur = {ts: b.ts, ts_open: b.ts_open, o: b.o, h: b.h, l: b.l, c: b.c};
      D.bars.push(cur); D.frames.push(S.frames[i]);
    } else {
      cur.ts = b.ts; cur.c = b.c;
      if (b.h > cur.h) cur.h = b.h;
      if (b.l < cur.l) cur.l = b.l;
      D.frames[D.frames.length - 1] = S.frames[i];
    }
  }
}
const V = {                    // вид
  follow: true,                // авто: правый край = последний бар, Y по свечам
  colW: 6,                     // пикселей на бар (зум по времени)
  pLo: 0, pHi: 1,              // окно цены (зум/пан по цене)
  end: 0,                      // индекс кадра у правого края (пан по времени)
  drawnCols: 0, drawnEnd: 0,   // что реально лежит на тепловом слое
  eq: null,                    // цветовая шкала: сортированная выборка log1p-тепла
  hover: null,                 // {x, y} курсора для перекрестия
};

const LUT = (() => {
  const stops = [[13,17,23],[14,52,56],[15,127,116],[47,214,176],[255,238,88]];
  const lut = [];
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * (stops.length - 1), j = Math.min(Math.floor(t), stops.length - 2), f = t - j;
    lut.push(stops[j].map((c, k) => Math.round(c + (stops[j+1][k] - c) * f)));
  }
  return lut;
})();
const colColor = h => {
  /* ранговая шкала (выравнивание гистограммы): цвет = положение ячейки в
     отсортированной выборке всего тепла. Даёт текстуру при ЛЮБОМ
     распределении — плотный пласт одинаково-крупных ячеек не сливается в
     одну заливку, как было с линейной шкалой по квантилям. Выборка
     пересчитывается редко (globalScale), поэтому дорисованные колонки
     консистентны с уже нарисованными. */
  const eq = V.eq;
  if (!eq || !eq.length) return "rgb(15,127,116)";
  const x = Math.log1p(h);
  let lo = 0, hi = eq.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (eq[m] < x) lo = m + 1; else hi = m; }
  const v = lo / eq.length;
  const c = LUT[Math.max(0, Math.min(255, Math.round(v * 255)))];
  return `rgb(${c[0]},${c[1]},${c[2]})`;
};

const H = () => heatCv.height, W = () => heatCv.width;
const priceToY = p => H() - (p - V.pLo) / (V.pHi - V.pLo) * H();
const yToPrice = y => V.pLo + (H() - y) / H() * (V.pHi - V.pLo);
const visCount = () => Math.min(V.end + 1, Math.floor(W() / V.colW));

function autoRange() {
  /* Как в терминалах: окно цены = торгуемый диапазон видимых свечей с
     запасом; глубокие пулы уходят за экран, свечи всегда крупные. */
  const n = visCount(), from = V.end - n + 1;
  let lo = Infinity, hi = -Infinity;
  for (let i = Math.max(0, from); i <= V.end; i++) {
    const b = D.bars[i];
    if (!b) continue;
    if (b.l < lo) lo = b.l;
    if (b.h > hi) hi = b.h;
  }
  if (lo === Infinity) return;
  // запас в долях ЦЕНЫ, не только диапазона: ближние ранги плеч (100-125x,
  // ~0.8-1% от цены) должны попадать в кадр, как в статичном рендере
  const last = D.bars[V.end];
  const pad = Math.max((hi - lo) * 0.18, (last ? last.c : hi) * 0.0075);
  V.pLo = lo - pad; V.pHi = hi + pad;
}

function updateVmax(newFrames) {
  let m = Math.expm1(S.vmaxLog);
  let grew = false;
  for (const fr of newFrames) for (const [, h] of fr.cols) if (h > m) { m = h; grew = true; }
  if (grew) S.vmaxLog = Math.log1p(m * 1.3);
  return grew && Math.log1p(m) > S.vmaxLog * 0.999; // вырос за запас -> repaint
}

function drawCol(x, fr) {
  const rowPx = S.bucket / (V.pHi - V.pLo) * H();
  for (const [i, h] of fr.cols) {
    const yTop = priceToY((i + 1) * S.bucket);
    if (yTop > H() || yTop + rowPx < 0) continue;
    hx.fillStyle = colColor(h);
    hx.fillRect(x, yTop, V.colW, Math.max(rowPx, 1));
  }
}

let scaleFramesAt = 0;   // сколько сырых кадров было при последнем расчёте шкалы
function globalScale() {
  /* СТАБИЛЬНАЯ шкала: квантили log1p тепла по ВСЕМ локальным кадрам
     (сэмплированно), а не по видимым — иначе полосы меняют цвет и «исчезают»
     при каждом зуме или сдвиге. Пересчёт только при снапшоте и заметном
     росте данных (см. tick) — НИКОГДА при зуме/пане. */
  const step = Math.max(1, Math.floor(D.frames.length / 400));
  const vals = [];
  for (let i = 0; i < D.frames.length; i += step) {
    const fr = D.frames[i];
    if (!fr) continue;
    for (const [, h] of fr.cols) if (h > 0) vals.push(Math.log1p(h));
  }
  scaleFramesAt = S.frames.length;
  vals.sort((a, b) => a - b);
  // ограничить выборку: бинарный поиск на 4000 точек — доли микросекунды
  const cap = 4000;
  if (vals.length > cap) {
    const thin = [];
    for (let i = 0; i < cap; i++) thin.push(vals[Math.floor(i * vals.length / cap)]);
    V.eq = thin;
  } else V.eq = vals;
}

function drawProjection() {
  /* пустота справа от последней колонки = проекция ТЕКУЩЕГО кадра вперёд —
     «что ещё висит», как в статичном рендере; это представление, не прогноз */
  const x0 = V.drawnCols * V.colW;
  if (x0 >= W()) return;
  hx.fillStyle = "#0d1117"; hx.fillRect(x0, 0, W() - x0, H());
  const fr = D.frames[V.end];
  if (!fr) return;
  const rowPx = S.bucket / (V.pHi - V.pLo) * H();
  for (const [i, h] of fr.cols) {
    const yTop = priceToY((i + 1) * S.bucket);
    if (yTop > H() || yTop + rowPx < 0) continue;
    hx.fillStyle = colColor(h);
    hx.fillRect(x0, yTop, W() - x0, Math.max(rowPx, 1));
  }
}

function repaintHeat() {
  hx.fillStyle = "#0d1117"; hx.fillRect(0, 0, W(), H());
  const n = visCount(), from = V.end - n + 1;
  for (let i = Math.max(0, from); i <= V.end; i++)
    drawCol((i - from) * V.colW, D.frames[i]);
  V.drawnCols = n; V.drawnEnd = V.end;
  drawProjection();
  window.__fullRepaints++;
}

function appendHeat(count) {
  /* follow-режим, вид не менялся: дорисовать count новых колонок справа. */
  for (let k = count; k > 0; k--) {
    const idx = V.end - k + 1, cap = Math.floor(W() / V.colW);
    if (V.drawnCols >= cap) {
      hx.drawImage(heatCv, V.colW, 0, W() - V.colW, H(), 0, 0, W() - V.colW, H());
      hx.fillStyle = "#0d1117"; hx.fillRect(W() - V.colW, 0, V.colW, H());
      V.drawnCols--;
    }
    drawCol(V.drawnCols * V.colW, D.frames[idx]);
    V.drawnCols++; window.__appends++;
  }
  V.drawnEnd = V.end;
  drawProjection();
}

function drawOverlay() {
  ox.clearRect(0, 0, W(), H());
  if (!D.bars.length) return;
  const n = visCount(), from = Math.max(0, V.end - n + 1);
  for (let i = from; i <= V.end; i++) {
    const b = D.bars[i];
    if (!b) continue;
    const x = (i - from) * V.colW + V.colW / 2, up = b.c >= b.o;
    ox.strokeStyle = ox.fillStyle = up ? "#26a69a" : "#ef5350";
    ox.lineWidth = Math.max(1, V.colW / 7);
    ox.beginPath(); ox.moveTo(x, priceToY(b.h)); ox.lineTo(x, priceToY(b.l)); ox.stroke();
    const y1 = priceToY(Math.max(b.o, b.c)), y2 = priceToY(Math.min(b.o, b.c));
    ox.fillRect(x - V.colW * 0.34, y1, V.colW * 0.68, Math.max(y2 - y1, 1));
  }
  const last = D.bars[D.bars.length - 1];
  if (last) {
    const y = priceToY(last.c);
    if (y >= 0 && y <= H()) {
      ox.strokeStyle = "#c5d0d9"; ox.setLineDash([5, 4]); ox.lineWidth = 0.8;
      ox.beginPath(); ox.moveTo(0, y); ox.lineTo(W(), y); ox.stroke(); ox.setLineDash([]);
      ox.font = "11px monospace";
      const label = fmtPrice(last.c), tw = ox.measureText(label).width + 10;
      ox.fillStyle = last.c >= last.o ? "#26a69a" : "#ef5350";
      ox.fillRect(W() - tw, y - 9, tw, 18);
      ox.fillStyle = "#0d1117"; ox.textAlign = "right"; ox.fillText(label, W() - 5, y + 4);
    }
  }
  ox.fillStyle = "#5c6f7a"; ox.textAlign = "left"; ox.font = "11px monospace";
  for (let t = 0; t <= 6; t++) {
    const p = V.pLo + (V.pHi - V.pLo) * t / 6;
    ox.fillText(fmtPrice(p), 4, priceToY(p) - 3);
  }
  const fr = D.frames[V.end];
  if (fr) {
    const lastY = last ? priceToY(last.c) : -99;
    const top = [...fr.cols].sort((a, b) => b[1] - a[1]).slice(0, 6);
    ox.textAlign = "right"; ox.fillStyle = "#ffe95c";
    for (const [i, h] of top) {
      const py = priceToY((i + 0.5) * S.bucket);
      if (py < 10 || py > H() - 4 || Math.abs(py - lastY) < 12) continue;
      ox.fillText(fmtUsd(h), W() - 5, py + 3);
    }
  }
  drawTimeAxis(from);
  drawCrosshair(from);
}

function fmtTime(ts, withDate) {
  const d = new Date(ts / 1e6);
  const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const dm = `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}`;
  return withDate ? `${dm} ${hm}` : hm;
}

function drawTimeAxis(from) {
  /* метки времени по нижнему краю; дата добавляется на границе суток и на
     старших ТФ, где чистое «чч:мм» неоднозначно */
  const n = visCount();
  if (!n) return;
  const every = Math.max(1, Math.ceil(120 / V.colW));   // метка раз в ~120px
  ox.fillStyle = "#5c6f7a"; ox.textAlign = "center"; ox.font = "10px monospace";
  let prevDay = null;
  for (let i = from; i <= V.end; i++) {
    const b = D.bars[i];
    if (!b) continue;
    const day = new Date(b.ts_open / 1e6).getDate();
    const dayEdge = prevDay !== null && day !== prevDay;
    prevDay = day;
    if ((i - from) % every !== 0 && !dayEdge) continue;
    const x = (i - from) * V.colW + V.colW / 2;
    ox.fillText(fmtTime(b.ts_open, dayEdge || S.tf >= 30), x, H() - 6);
    ox.fillRect(x - 0.5, H() - 20, 1, 4);
  }
}

function drawCrosshair(from) {
  if (!V.hover) return;
  const {x, y} = V.hover;
  const i = from + Math.floor(x / V.colW);
  const b = D.bars[i];
  ox.strokeStyle = "#5c6f7a"; ox.lineWidth = 0.6; ox.setLineDash([3, 3]);
  ox.beginPath(); ox.moveTo(0, y); ox.lineTo(W(), y); ox.stroke();
  if (b) {
    const bx = (i - from) * V.colW + V.colW / 2;
    ox.beginPath(); ox.moveTo(bx, 0); ox.lineTo(bx, H()); ox.stroke();
  }
  ox.setLineDash([]);
  // плашка: время свечи, OHLC, цена под курсором и тепло её бакета
  const p = yToPrice(y);
  const idx = Math.floor(p / S.bucket);
  const fr2 = D.frames[Math.min(i, V.end)];
  let heat = 0;
  if (fr2) for (const [ci, h] of fr2.cols) if (ci === idx) { heat = h; break; }
  const lines = [];
  if (b) lines.push(`${fmtTime(b.ts_open, true)}  O ${fmtPrice(b.o)}  H ${fmtPrice(b.h)}  L ${fmtPrice(b.l)}  C ${fmtPrice(b.c)}`);
  lines.push(`цена ${fmtPrice(p)}` + (heat > 0 ? `  тепло ${fmtUsd(heat)}` : ""));
  ox.font = "11px monospace";
  const wMax = Math.max(...lines.map(t => ox.measureText(t).width)) + 14;
  const hBox = lines.length * 16 + 8;
  const bxr = Math.min(x + 14, W() - wMax - 4), byr = Math.max(4, y - hBox - 10);
  ox.fillStyle = "rgba(13,17,23,.92)"; ox.fillRect(bxr, byr, wMax, hBox);
  ox.strokeStyle = "#1d2733"; ox.lineWidth = 1; ox.strokeRect(bxr, byr, wMax, hBox);
  ox.fillStyle = "#c5d0d9"; ox.textAlign = "left";
  lines.forEach((t, k) => ox.fillText(t, bxr + 7, byr + 16 + k * 16));
}

function refreshView() { if (V.follow) { V.end = D.frames.length - 1; autoRange(); }
  repaintHeat(); drawOverlay(); }

const fmtPrice = p => p >= 1000 ? p.toFixed(0) : p >= 10 ? p.toFixed(2) : p.toFixed(4);
const fmtUsd = v => v >= 1e9 ? `$${(v/1e9).toFixed(1)}B` : v >= 1e6 ? `$${(v/1e6).toFixed(1)}M`
  : v >= 1e3 ? `$${(v/1e3).toFixed(1)}K` : `$${v.toFixed(0)}`;

/* --- управление видом --- */
function setFollow(on) {
  V.follow = on;
  $("follow").classList.toggle("active", on);
  if (on) refreshView();
}
wrap.addEventListener("wheel", e => {
  e.preventDefault();
  if (!S.frames.length) return;
  if (e.shiftKey) {                                  // зум по времени
    V.colW = Math.max(2, Math.min(24, V.colW * (e.deltaY < 0 ? 1.25 : 0.8)));
  } else {                                           // зум по цене вокруг курсора
    const y = e.offsetY, p = yToPrice(y), f = e.deltaY < 0 ? 0.85 : 1 / 0.85;
    V.pLo = p - (p - V.pLo) * f; V.pHi = p + (V.pHi - p) * f;
    if (V.follow) { V.follow = false; $("follow").classList.remove("active"); }
  }
  repaintHeat(); drawOverlay();
}, {passive: false});
let drag = null;
wrap.addEventListener("pointerdown", e => {
  drag = {x: e.clientX, y: e.clientY, pLo: V.pLo, pHi: V.pHi, end: V.end};
  wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener("pointermove", e => {
  if (!drag) return;
  // тянешь вверх — график едет вверх за курсором (окно цены вниз), как в
  // торговых терминалах
  const dp = (drag.y - e.clientY) / H() * (V.pHi - V.pLo);
  V.pLo = drag.pLo - dp; V.pHi = drag.pHi - dp;
  const dCols = Math.round((e.clientX - drag.x) / V.colW);
  V.end = Math.max(Math.min(drag.end - dCols, D.frames.length - 1), Math.min(20, D.frames.length - 1));
  if (V.follow && (dp || dCols)) { V.follow = false; $("follow").classList.remove("active"); }
  repaintHeat(); drawOverlay();
});
wrap.addEventListener("pointermove", e => {
  if (drag) { V.hover = null; return; }
  V.hover = {x: e.offsetX, y: e.offsetY};
  drawOverlay();
});
wrap.addEventListener("pointerleave", () => { V.hover = null; drawOverlay(); });
const endDrag = () => { drag = null; wrap.classList.remove("drag"); };
wrap.addEventListener("pointerup", endDrag);
wrap.addEventListener("pointercancel", endDrag);
wrap.addEventListener("dblclick", () => setFollow(true));
$("follow").onclick = () => setFollow(!V.follow);
$("zin").onclick = () => { V.colW = Math.min(24, V.colW * 1.25); refreshView(); };
$("zout").onclick = () => { V.colW = Math.max(2, V.colW * 0.8); refreshView(); };

function resize() {
  const r = wrap.getBoundingClientRect();
  for (const cv of [heatCv, ovCv]) { cv.width = r.width; cv.height = r.height; }
  if (D.frames.length) refreshView();
}
window.addEventListener("resize", resize);

/* --- данные --- */
async function api(path) {
  const r = await fetch(path, {cache: "no-store"});
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}
const setStatus = t => { $("status").innerHTML = t; };

async function loadSnapshot() {
  const snap = await api(`/api/snapshot?symbol=${S.symbol}`);
  if (snap.type === "warming") {          // лейк ещё без баров: ждём первые
    setStatus("ждём первые бары из лейка…");
    return false;
  }
  S.epoch = snap.epoch; S.bucket = snap.bucket_size;
  S.frames = snap.frames; S.bars = snap.bars; S.lastTs = snap.last_ts || 0;
  S.vmaxLog = 1; updateVmax(S.frames);
  buildDisplay();
  globalScale();
  V.end = D.frames.length - 1;
  if (V.follow || V.pHi <= V.pLo) { V.follow = true; $("follow").classList.add("active"); autoRange(); }
  repaintHeat(); drawOverlay();
  return true;
}

async function tick() {
  try {
    if (!S.epoch && !(await loadSnapshot())) return;
    const d = await api(`/api/delta?symbol=${S.symbol}&since=${S.lastTs}&epoch=${S.epoch}`);
    if (d.type === "warming") { setStatus("ждём первые бары из лейка…"); return; }
    if (d.gap || d.epoch !== S.epoch) {
      window.__gapReloads++;
      await loadSnapshot();
    } else if (d.frames.length) {
      S.frames.push(...d.frames); S.bars.push(...d.bars);
      const over = S.frames.length - S.keep;
      if (over > 0) {
        S.frames.splice(0, over); S.bars.splice(0, over);
        const shift = Math.ceil(over / S.tf);   // консервативный сдвиг вида
        V.end = Math.max(0, V.end - shift); V.drawnEnd = Math.max(0, V.drawnEnd - shift);
      }
      S.lastTs = d.last_ts;
      const vmaxGrew = updateVmax(d.frames);
      const prevCols = D.bars.length;
      buildDisplay();
      // шкала пересчитывается редко: рост максимума или +300 кадров данных
      const rescale = vmaxGrew || S.frames.length - scaleFramesAt >= 300;
      if (rescale) globalScale();
      if (V.follow) {
        V.end = D.frames.length - 1;
        // гистерезис: окно цены ЛИПКОЕ — пересчитываем его только когда
        // последняя свеча подошла к краю; иначе вид не меняется и новые
        // колонки просто дорисовываются (append — штатный путь)
        const b = D.bars[D.bars.length - 1];
        const margin = (V.pHi - V.pLo) * 0.04;
        const cramped = !b || b.h > V.pHi - margin || b.l < V.pLo + margin;
        if (cramped) autoRange();
        if (cramped || rescale) repaintHeat();
        else {
          // законченные колонки показа дорисовываются; формирующаяся
          // (последняя) переписывается по месту — это не перерисовка вида
          const newCols = D.bars.length - prevCols;
          appendHeat(Math.max(newCols, 0));
          if (newCols === 0 && V.drawnCols > 0) {
            const x = (V.drawnCols - 1) * V.colW;
            hx.fillStyle = "#0d1117"; hx.fillRect(x, 0, V.colW, H());
            drawCol(x, D.frames[V.end]);
            drawProjection();
          }
        }
      }               // follow выключен: экран заморожен, данные копятся молча
      drawOverlay();
    }
    const fr = S.frames[S.frames.length - 1];
    const total = fr ? fr.cols.reduce((a, c) => a + c[1], 0) : 0;
    setStatus(`эпоха <b>${S.epoch}</b> · кадров ${D.frames.length} · ` +
      `тепло ${fmtUsd(total)} · дорисовок ${window.__appends} · ` +
      `перерисовок ${window.__fullRepaints}${V.follow ? "" : " · <b>пауза</b>"}`);
  } catch (e) { setStatus(`нет связи: ${e.message}`); }
}

async function main() {
  const meta = await api("/api/meta");
  const sel = $("symbol");
  sel.innerHTML = meta.symbols.map(s => `<option>${s}</option>`).join("");
  S.symbol = meta.symbols[0];
  sel.onchange = async () => { S.symbol = sel.value; S.epoch = null; setFollow(true); await tick(); };
  $("tf").onchange = () => {
    S.tf = parseInt($("tf").value, 10);
    buildDisplay();
    globalScale();
    setFollow(true);       // смена нарезки — новый вид: авто-кадр и перерисовка
    refreshView();
  };
  resize();
  await tick();
  setInterval(tick, 2000);
}
main();
</script>
</body>
</html>
